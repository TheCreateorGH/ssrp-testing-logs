<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>SSRP setup</title>
  <style>
    body { color: #eee; font: 13px sans-serif; margin: 12px; }
    label { display: block; margin: 9px 0 4px; }
    input { box-sizing: border-box; width: 100%; padding: 6px; }
    button { margin-top: 12px; padding: 7px 10px; }
    #status { min-height: 18px; margin-top: 9px; }
  </style>
</head>
<body>
  <label for="apiBaseUrl">API URL</label>
  <input id="apiBaseUrl" placeholder="http://127.0.0.1:28519">
  <label for="username">Username (setup only)</label>
  <input id="username" autocomplete="username">
  <label for="password">Password (setup only)</label>
  <input id="password" type="password" autocomplete="current-password">
  <label for="label">Device label</label>
  <input id="label" value="Stream Deck">
  <button id="save">Save setup</button>
  <button id="clear" type="button">Clear setup</button>
  <div id="status"></div>
  <script src="setup.js"></script>
</body>
</html>
